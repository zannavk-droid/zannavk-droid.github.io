<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди пару — Природные материалы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #d4edda 0%, #fff8e1 50%, #d7ccc8 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    color: #3e2723;
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    color: #2e7d32;
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 10px;
    text-align: center;
  }

  .subtitle {
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    color: #5d4037;
    margin-bottom: 15px;
    text-align: center;
  }

  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 15px;
  }

  .stat-box {
    background: #fff;
    border: 3px solid #8d6e63;
    border-radius: 15px;
    padding: 8px 18px;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    font-weight: bold;
    color: #4e342e;
    box-shadow: 0 4px 0 #8d6e63;
    min-width: 100px;
    text-align: center;
  }

  .stat-box span { color: #2e7d32; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(6px, 1.5vw, 12px);
    width: min(95vw, 560px);
    aspect-ratio: 1 / 1;
    padding: 10px;
    background: rgba(255,255,255,0.5);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  .card {
    position: relative;
    perspective: 1000px;
    cursor: pointer;
    border-radius: 12px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2rem, 7vw, 3.5rem);
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    user-select: none;
  }

  .card-front {
    background: linear-gradient(135deg, #66bb6a, #43a047);
    border: 3px solid #2e7d32;
    color: #fff;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
  }

  .card-front::after {
    content: "🌱";
  }

  .card-back {
    background: linear-gradient(135deg, #fff9c4, #fff59d);
    border: 3px solid #f57f17;
    transform: rotateY(180deg);
  }

  .card.matched .card-back {
    background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
    border-color: #2e7d32;
    animation: matchPulse 0.6s ease;
  }

  .card.wrong .card-back {
    animation: shake 0.5s ease;
    border-color: #e53935;
  }

  @keyframes matchPulse {
    0%, 100% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.1); }
  }

  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  .btn {
    margin-top: 15px;
    padding: 12px 28px;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-family: inherit;
    font-weight: bold;
    background: linear-gradient(135deg, #ff9800, #f57c00);
    color: white;
    border: 3px solid #e65100;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 0 #bf360c;
    transition: transform 0.1s;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bf360c; }

  /* Модальное окно победы */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.4s ease;
  }

  .modal.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: linear-gradient(135deg, #fff9c4, #fff59d);
    border: 5px solid #f57f17;
    border-radius: 25px;
    padding: 30px 40px;
    text-align: center;
    max-width: 90%;
    animation: popIn 0.5s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .modal-content h2 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    color: #2e7d32;
    margin-bottom: 15px;
  }

  .modal-content p {
    font-size: clamp(1rem, 3vw, 1.3rem);
    margin-bottom: 10px;
    color: #4e342e;
  }

  .trophy { font-size: clamp(3rem, 10vw, 5rem); margin: 10px 0; }

  @media (max-width: 400px) {
    .stat-box { min-width: 85px; padding: 6px 12px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<h1>🌿 Найди пару 🍂</h1>
<p class="subtitle">Природные материалы: шишки, листья, веточки, жёлуди</p>

<div class="stats">
  <div class="stat-box">⏱ Время: <span id="timer">0</span> с</div>
  <div class="stat-box">👣 Ходы: <span id="moves">0</span></div>
  <div class="stat-box">✅ Пары: <span id="pairs">0</span>/8</div>
</div>

<div class="board" id="board"></div>

<button class="btn" id="restart">🔄 Новая игра</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="trophy">🏆</div>
    <h2>Поздравляем! 🎉</h2>
    <p>Ты нашёл все пары!</p>
    <p>⏱ Время: <span id="finalTime">0</span> с</p>
    <p>👣 Ходов: <span id="finalMoves">0</span></p>
    <button class="btn" id="playAgain">🌳 Играть снова</button>
  </div>
</div>

<script>
  // === Звуки через Web Audio API (работают без интернета) ===
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', volume = 0.2) {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function soundFlip() {
    playTone(600, 0.1, 'sine', 0.15);
    setTimeout(() => playTone(800, 0.08, 'sine', 0.12), 50);
  }

  function soundMatch() {
    // Весёлая последовательность нот
    const notes = [523, 659, 784, 1047]; // до-ми-соль-до
    notes.forEach((n, i) => {
      setTimeout(() => playTone(n, 0.15, 'triangle', 0.2), i * 100);
    });
  }

  function soundWrong() {
    playTone(200, 0.15, 'sawtooth', 0.15);
    setTimeout(() => playTone(150, 0.2, 'sawtooth', 0.12), 120);
  }

  function soundWin() {
    // Победная мелодия
    const melody = [
      [523, 0.15], [659, 0.15], [784, 0.15], [1047, 0.3],
      [784, 0.15], [1047, 0.4]
    ];
    let t = 0;
    melody.forEach(([freq, dur]) => {
      setTimeout(() => playTone(freq, dur, 'triangle', 0.25), t * 1000);
      t += dur + 0.05;
    });
  }

  // === Игровая логика ===
  const symbols = ['🌰', '🍁', '🌲', '🌿', '🍂', '🍃', '🪵', '🌻'];

  const board = document.getElementById('board');
  const timerEl = document.getElementById('timer');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const modal = document.getElementById('modal');
  const finalTime = document.getElementById('finalTime');
  const finalMoves = document.getElementById('finalMoves');

  let firstCard = null;
  let secondCard = null;
  let lockBoard = false;
  let moves = 0;
  let pairsFound = 0;
  let timerInterval = null;
  let seconds = 0;
  let gameStarted = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startTimer() {
    if (gameStarted) return;
    gameStarted = true;
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = seconds;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function createBoard() {
    board.innerHTML = '';
    const deck = shuffle([...symbols, ...symbols]);

    deck.forEach(symbol => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.symbol = symbol;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${symbol}</div>
        </div>
      `;
      card.addEventListener('click', () => flipCard(card));
      board.appendChild(card);
    });
  }

  function flipCard(card) {
    if (lockBoard) return;
    if (card === firstCard) return;
    if (card.classList.contains('matched')) return;
    if (card.classList.contains('flipped')) return;

    startTimer();
    soundFlip();
    card.classList.add('flipped');

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }

  function checkMatch() {
    const isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;

    if (isMatch) {
      soundMatch();
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      pairsFound++;
      pairsEl.textContent = pairsFound;
      resetTurn();

      if (pairsFound === symbols.length) {
        setTimeout(() => {
          stopTimer();
          soundWin();
          finalTime.textContent = seconds;
          finalMoves.textContent = moves;
          modal.classList.add('show');
        }, 600);
      }
    } else {
      soundWrong();
      firstCard.classList.add('wrong');
      secondCard.classList.add('wrong');
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped', 'wrong');
        secondCard.classList.remove('flipped', 'wrong');
        resetTurn();
      }, 1000);
    }
  }

  function resetTurn() {
    [firstCard, secondCard, lockBoard] = [null, null, false];
  }

  function resetGame() {
    stopTimer();
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    moves = 0;
    pairsFound = 0;
    seconds = 0;
    gameStarted = false;
    timerEl.textContent = '0';
    movesEl.textContent = '0';
    pairsEl.textContent = '0';
    modal.classList.remove('show');
    createBoard();
  }

  document.getElementById('restart').addEventListener('click', resetGame);
  document.getElementById('playAgain').addEventListener('click', resetGame);

  // Старт игры
  createBoard();
</script>

</body>
</html>
